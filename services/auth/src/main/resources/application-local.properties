# 로컬 Compose 기본값. 실제 AWS 환경에서는 별도 프로필과 환경 변수를 사용합니다.
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:15432/weavo_auth}
spring.datasource.username=${DATABASE_USER:weavo}
spring.datasource.password=${DATABASE_PASSWORD:weavo-local-password}
spring.jpa.hibernate.ddl-auto=none
