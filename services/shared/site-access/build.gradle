plugins {
    id 'java-library'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.weavo'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.crawler-commons:crawler-commons:1.6'
    implementation 'com.microsoft.playwright:playwright:1.55.0'
    implementation 'org.jsoup:jsoup:1.24.1'

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'browser' }
}

spotless { java { googleJavaFormat() } }

tasks.register('browserTest', Test) {
    group = 'verification'
    description = 'Exercise guarded site access with installed Chromium and a local test server.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'browser' }
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
}
