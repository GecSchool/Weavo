name: Code conventions
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test
  spring:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: weavo_test
          POSTGRES_USER: weavo
          POSTGRES_PASSWORD: weavo-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U weavo -d weavo_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/weavo_test
      DATABASE_USER: weavo
      DATABASE_PASSWORD: weavo-test
    strategy:
      fail-fast: false
      matrix:
        service: [auth, control, data, ingestion]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon spotlessCheck test

  workers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [analysis, crawler]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon spotlessCheck test
